name: CI

# scripts/preflight.sh runs the same commands with the same arguments locally;
# a step added here is added there in the same commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # - macos-latest      → aarch64-apple-darwin
        # - ubuntu-24.04-arm  → aarch64-unknown-linux-gnu
        # - ubuntu-latest     → x86_64-unknown-linux-gnu
        # - windows-latest    → x86_64-pc-windows-msvc
        # x86_64 takes the rcpss / rsqrtss paths of fast_rcp / fast_inv_sqrt,
        # aarch64 the IEEE `1.0 / x` and `1.0 / x.sqrt()` paths
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # the toolchain itself comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (unit + doc, every feature)
        run: cargo test --all-features

      - name: Test (unit + doc, default features)
        run: cargo test

      # the no_std code path (libm::fmaf / libm::sqrtf) executed on the host:
      # the library is built without `std`, only the test harness links it.
      # This runs the code, it does not prove the library builds without std
      # (that is the `no_std` job below).
      - name: Test (lib, no_std code path via libm)
        run: cargo test --lib --no-default-features --features libm

      - name: Benches compile
        run: cargo bench --no-run

  no-std:
    name: Build (no_std, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # installs the target for the toolchain pinned in rust-toolchain.toml
      - name: Add thumbv7em-none-eabihf
        run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # a bare-metal target has no std at all, so this is the build that proves
      # the library compiles without it (`cargo test --no-default-features`
      # cannot: the test harness links std). cargo drops the cdylib crate type
      # for this target and builds the rlib.
      - name: Build (lib, no_std + libm)
        run: cargo build --lib --no-default-features --features libm --target thumbv7em-none-eabihf
      - name: Clippy (lib, no_std + libm)
        run: cargo clippy --lib --no-default-features --features libm --target thumbv7em-none-eabihf -- -D warnings

  wasm:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build (lib, default features)
        run: cargo build --lib --target wasm32-unknown-unknown

  clippy:
    name: Clippy (pedantic + nursery, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pedantic / nursery are enabled in Cargo.toml [lints.clippy]
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # --tests, not --all-targets: a no_std cdylib for the host needs a
      # panic_handler and an allocator; the no_std library itself is linted in
      # the no-std job
      - name: Clippy (no_std + libm, tests)
        run: cargo clippy --tests --no-default-features --features libm -- -D warnings

  # The declared `rust-version` compiled with exactly that toolchain. Bump
  # `rust-version` in Cargo.toml and the version below in the same commit.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      # library only: the dev-dependencies (criterion) follow their own MSRV
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib
      - name: cargo check on MSRV (lib, all features)
        run: cargo +1.87 check --lib --all-features

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, all features)
        run: cargo doc --lib --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  docs-lint:
    # run on every OS so a locale or path difference in the checker itself
    # shows up here rather than as a silent pass
    name: Docs lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
